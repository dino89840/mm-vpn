plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mmvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mmvpn'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // True when a valid release keystore is available (set via env in CI).
    // Otherwise the release build falls back to debug signing so a testable
    // APK can still be produced without secrets configured.
    def hasReleaseKeystore = false

    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath != null) {
                def ksFile = file(ksPath)
                if (ksFile.exists() && ksFile.length() > 1024) {
                    storeFile = ksFile
                    storePassword = System.getenv('KEYSTORE_PASSWORD')
                    keyAlias = System.getenv('KEY_ALIAS')
                    keyPassword = System.getenv('KEY_PASSWORD')
                    hasReleaseKeystore = true
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // classes.jar extracted from libbox.aar by CI (see workflow)
    // native .so files go to src/main/jniLibs (auto-packaged by AGP)
    implementation files('libs/classes.jar')
}
